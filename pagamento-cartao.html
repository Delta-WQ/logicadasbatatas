<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pagamento via Cartão</title>
</head>
<body>
  <h1>Pagamento via Cartão</h1>
  <p>Insira os dados do seu cartão para concluir a compra.</p>

  <form>
    <label>Número do cartão:</label><br>
    <input type="text" name="numero"><br><br>

    <label>Validade:</label><br>
    <input type="text" name="validade"><br><br>

    <label>CVV:</label><br>
    <input type="text" name="cvv"><br><br>

    <button type="submit">Pagar</button>
  </form>
</body>
</html>
