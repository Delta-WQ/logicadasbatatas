<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Lógica das Batatas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    header {
      background: #222;
      color: white;
      padding: 25px;
    }

    main {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 10px;
    }

    .preco {
      font-size: 30px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      background: #3483fa;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🥔 A Lógica das Batatas</h1>
  <p>O jogo oficial</p>
</header>

<main>

  <h2>Comprar o jogo</h2>

  <p>
    Adquira acesso ao jogo A Lógica das Batatas.
  </p>

  <div class="preco">
    R$ 1,00
  </div>

  <button id="botaoComprar" onclick="comprarJogo()">
    Comprar agora
  </button>

  <div id="mensagem"></div>

</main>

<script>

async function comprarJogo() {

  const botao = document.getElementById("botaoComprar");
  const mensagem = document.getElementById("mensagem");

  botao.disabled = true;
  botao.textContent = "Abrindo pagamento...";
  mensagem.textContent = "";

  try {

    const resposta = await fetch("/criar-pagamento", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      }
    });

    const dados = await resposta.json();

    if (!resposta.ok || !dados.sucesso) {
      throw new Error(dados.erro || "Erro ao criar pagamento");
    }

    // Envia o comprador para o checkout do Mercado Pago
    window.location.href = dados.checkout_url;

  } catch (erro) {

    console.error(erro);

    mensagem.textContent =
      "Não foi possível iniciar o pagamento. Tente novamente.";

    botao.disabled = false;
    botao.textContent = "Comprar agora";
  }
}

</script>

</body>
</html>
